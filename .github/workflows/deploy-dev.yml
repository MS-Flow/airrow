name: Deploy to DEV
on:
  push:
    branches:
      - develop
      - 'feature/**'   # varje feature deployar löpande till DEV (se BRANCHING.md)

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Deploy to Vercel (DEV/preview). Secrets live in GitHub Secrets — never hardcode keys.
      # Add these repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
      - name: Deploy to Vercel (DEV)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN saknas — hoppar över DEV-deploy tills secrets är satta."
            exit 0
          fi
          pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
