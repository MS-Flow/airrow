name: Branch policy
# Sätter rätt base-gren OCH validerar merge-riktningen — i den ordningen, i ett jobb.
#
#   <nr>-kort  -> sin feature/<name>   (härledd ur specens Branch-rad)
#   feature/*  -> develop              (aldrig main)
#   develop    -> main                 (release-PR:en; enda vägen in i main)
#
# Varför ett jobb och inte två workflows: som separata körningar kapplöpte de. En PR som
# öppnades mot `main` (GitHub föreslår default-grenen) hann bli validerad och FAILA innan
# basen rättades — och eftersom åtgärder med `GITHUB_TOKEN` aldrig triggar nya
# workflow-körningar körde ingenting om den failade checken. Mot en skyddad base blev PR:en
# därmed permanent omöjlig att merga. Ordningen här gör kapplöpningen omöjlig.
#
# Jobb-id:t `validate-source-branch` är den required status check som
# scripts/setup-branch-protection.sh registrerar på main/develop — byt inte namn på det
# utan att uppdatera skriptet och applicera rulesetet om.
#
# `pull_request` (inte `pull_request_target`): skrivtoken får aldrig köra kod från en fork.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    steps:
      # Head-ref:en, inte merge-ref:en — specen skapas normalt i samma PR och finns
      # därför bara på head när det här körs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Bara vid `opened`. En base som ändras i efterhand rörs aldrig, så automatiken kan
      # inte hamna i en dragkamp med en människa; ett medvetet undantag görs genom att byta
      # base EFTER att PR:en öppnats.
      - name: Set base branch
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$HEAD" = "develop" ]; then
            # Release-PR. `develop` är enda grenen som får mergas in i `main`, så målet är
            # entydigt och behöver ingen härledning.
            TARGET="main"
          elif case "$HEAD" in feature/*) true ;; *) false ;; esac; then
            # En färdig feature går ett steg upp, till `develop`.
            TARGET="develop"
          else
            NUM=$(echo "$HEAD" | grep -oE '^[0-9]+' || true)
            if [ -z "$NUM" ]; then
              echo "'$HEAD' matchar ingen gren i hierarkin (develop, feature/*, <nr>-kort) — rör inte basen."
              exit 0
            fi

            # Numret ensamt räcker inte: `specs/14-*.md` matchar två specar från olika
            # features. Rätt spec är den vars Branch-rad nämner just den här grenen.
            TICK='`'
            SPEC=""
            for f in specs/"$NUM"-*.md; do
              [ -f "$f" ] || continue
              if grep -qF "$TICK$HEAD$TICK" "$f"; then
                SPEC="$f"
                break
              fi
            done

            if [ -z "$SPEC" ]; then
              MSG="Kunde inte härleda base-gren: ingen spec i \`specs/\` vars Branch-rad nämner \`$HEAD\`. Basen lämnas som \`$BASE\` — sätt rätt \`feature/*\` manuellt (se docs/architecture/BRANCHING.md)."
              echo "::warning::$MSG"
              gh pr comment "$PR" --repo "$REPO" --body "$MSG"
              exit 0
            fi

            # Branch-raden ser ut som: `<nr>-kort` (from `feature/<name>`)
            TARGET=$(grep -oE "from ${TICK}feature/[A-Za-z0-9._-]+${TICK}" "$SPEC" \
              | head -1 | tr -d "$TICK" | sed 's/^from //')

            if [ -z "$TARGET" ]; then
              MSG="Kunde inte härleda base-gren: \`$SPEC\` saknar \`(from feature/…)\` i sin Branch-rad. Basen lämnas som \`$BASE\`."
              echo "::warning::$MSG"
              gh pr comment "$PR" --repo "$REPO" --body "$MSG"
              exit 0
            fi
          fi

          if ! git ls-remote --exit-code --heads origin "$TARGET" > /dev/null 2>&1; then
            MSG="Kunde inte sätta base-gren: \`$TARGET\` finns inte på origin — troligen redan mergad och raderad. Basen lämnas som \`$BASE\`."
            echo "::warning::$MSG"
            gh pr comment "$PR" --repo "$REPO" --body "$MSG"
            exit 0
          fi

          if [ "$TARGET" = "$BASE" ]; then
            echo "Basen är redan '$TARGET' — inget att göra."
            exit 0
          fi

          echo "Sätter base '$BASE' -> '$TARGET'."
          gh pr edit "$PR" --repo "$REPO" --base "$TARGET"
          # Valideringen nedan måste se den NYA basen; `github.base_ref` är inaktuell efter
          # en `gh pr edit`, och en ny körning kommer inte (GITHUB_TOKEN triggar inga event).
          echo "EFFECTIVE_BASE=$TARGET" >> "$GITHUB_ENV"

      - name: Enforce merge rules
        env:
          EVENT_BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # EFFECTIVE_BASE sätts av steget ovan när basen skrevs om; annars gäller eventets.
          BASE="${EFFECTIVE_BASE:-$EVENT_BASE}"
          echo "Källgren: $HEAD -> Målgren: $BASE"
          case "$BASE" in
            main)
              if [ "$HEAD" != "develop" ]; then
                echo "::error::Endast 'develop' får mergas in i 'main' (fick '$HEAD')."
                exit 1
              fi
              ;;
            develop)
              case "$HEAD" in
                feature/*) : ;;
                *)
                  echo "::error::Endast 'feature/*' får mergas in i 'develop' (fick '$HEAD')."
                  exit 1
                  ;;
              esac
              ;;
            feature/*)
              if ! echo "$HEAD" | grep -qE '^[0-9]+-'; then
                echo "::error::Endast issue-grenar ('<nr>-<kort>') får mergas in i '$BASE' (fick '$HEAD')."
                exit 1
              fi
              ;;
            *)
              echo "Målgren '$BASE' omfattas inte av grenpolicyn — hoppar över."
              exit 0
              ;;
          esac
          echo "OK: $HEAD -> $BASE"
