name: CI
on:
  push:
  # Deliberately unfiltered: this covers every PR target, including `develop` and `main`
  # (the blocking gate) as well as `<nr>-kort` → `feature/**`, where breakage is cheapest
  # to catch. The `push` trigger matters for the ruleset — a required check must also be
  # produced by direct ref updates, or merges into develop would wait forever.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, for the migration check at the bottom of this job. It asks
          # `git diff origin/<base>...HEAD` to tell a migration this PR *adds* — expected to be
          # unapplied, the merge is what applies it — from one that merged earlier and never reached
          # the database. The three-dot form needs a merge base, and the default depth-1 checkout has
          # no ancestry to find one in: the diff fails, the script falls back to "treat every
          # unapplied migration as already merged", and every PR that adds a migration goes red for a
          # drift that does not exist. Seen on PR #124 (spec 122). Amends spec 77.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      # `pnpm -r test` only reaches the workspace projects (apps/*, packages/*). The CI
      # helpers in scripts/ live outside it and need their own run — see spec 53.
      - name: Test CI scripts
        run: pnpm test:scripts
      # Last, and on purpose: the production build is what catches crashes the unit tests
      # cannot see — bad server/client boundaries, RSC-only imports, failed prerenders.
      # No secrets needed; the app runs fully in local mode (apps/web/.env.example).
      - name: Build
        run: pnpm build
      # Dependency advisories (spec 33). `pnpm audit` rather than the Dependabot API: the
      # latter needs a fine-grained token Actions cannot mint, and today it reports zero
      # while audit reports 21. Production deps only — a hole in ESLint reaches no user.
      # Baseline in `.security/audit-baseline.json` makes this adoptable: pre-existing
      # advisories are accepted debt, anything NEW turns the check red.
      - name: Audit production dependencies
        run: |
          # `pnpm audit` exits non-zero whenever it finds anything, so the gate is our
          # comparison against the baseline — not this exit code.
          pnpm audit --prod --json > audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");

          const BLOCKING = ["high", "critical"];
          const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const baseline = JSON.parse(fs.readFileSync(".security/audit-baseline.json", "utf8"));

          const accepted = new Set(baseline.accepted.map((a) => a.id));
          const found = new Map();
          for (const a of Object.values(audit.advisories ?? {})) {
            if (BLOCKING.includes(a.severity)) {
              found.set(a.github_advisory_id, { severity: a.severity, module: a.module_name, url: a.url });
            }
          }

          // Baseline rows that no longer match anything: warn, never fail. Failing here
          // would punish a successful upgrade, which is the behaviour we want to encourage.
          const stale = [...accepted].filter((id) => !found.has(id));
          if (stale.length) {
            console.log(`::warning::${stale.length} rad(er) i .security/audit-baseline.json matchar ingen advisory längre och kan tas bort: ${stale.join(", ")}`);
          }

          const newly = [...found].filter(([id]) => !accepted.has(id));
          if (!newly.length) {
            console.log(`OK: inga nya high/critical advisories i produktionsberoenden (${accepted.size} accepterade i baseline).`);
            process.exit(0);
          }

          for (const [id, info] of newly) {
            console.log(`::error::Ny ${info.severity} advisory ${id} i '${info.module}' — ${info.url}`);
          }
          console.log(`::error::${newly.length} ny(a) advisory(er). Åtgärda, eller acceptera medvetet genom att lägga in dem i .security/audit-baseline.json med en motivering (se docs/guides/SECURITY.md).`);
          process.exit(1);
          NODE
      # Dead last, and on purpose: this is the only step that talks to something outside the
      # runner, so every deterministic gate above has already reported by the time a paused
      # project or a network blip can turn the job red. A step rather than its own job because
      # `verify` is a required status check — `scripts/setup-branch-protection.sh` lists the
      # contexts by hand, so a new job would block nothing until an admin re-ran that script.
      # Read-only: no `db push` here. Applying happens in `supabase-migrate.yml` after merge.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 (a branch, not a tag)
        with:
          # Unpinned deliberately. A CLI that changes the output format of `migration list`
          # cannot slip past quietly: the script fails when it parses a table into zero rows
          # while the repo holds migrations.
          version: latest
      - name: Check migrations against the linked database
        # The credentials are scoped to this one step rather than the job: every other step here
        # runs third-party code (`pnpm install` lifecycle scripts, the build), and none of it has
        # any business being able to read the production database password.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # A migration this change adds is expected to be unapplied — the merge is what applies it.
          # The script needs something to diff against to tell those apart from drift that was already
          # there: the base branch on a pull request, `develop` on a push to any other branch (spec
          # 130). `checkout` fetches the full history of one ref, so that ref still has to be fetched —
          # deliberately without `--depth`, which would make an otherwise complete clone shallow and
          # take the merge base away again, which is the failure this whole block exists to avoid.
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
          elif [ "$GITHUB_REF_NAME" != "develop" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            git fetch --no-tags origin develop
          fi
          node scripts/supabase-migration-drift.mjs
